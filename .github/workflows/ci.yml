name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_macos:
        description: 'Run macOS iOS/Desktop compilation check'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-and-tsnet:
    name: Protocol, Hub & Go tsnet (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tsnet-bridge/go.sum

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify unified version consistency
        run: node scripts/resolve-version.mjs --check

      - name: Verify bilingual CHANGELOG structure & parity
        run: node scripts/update-changelog.mjs --check

      - name: Verify protocol schema codegen & zero drift
        run: |
          pnpm --filter @lework/protocol gen
          git diff --exit-code protocol-schema/ app/shared/src/commonMain/kotlin/dev/lework/protocol/

      - name: Build & test embedded Go tsnet bridge (Host)
        run: ./scripts/build-tsnet.sh --host

      - name: TypeScript typecheck
        run: pnpm -r check

      - name: Run Protocol & Hub unit/integration tests
        run: pnpm -r test

  kmp-and-android:
    name: KMP Shared, Headless UI & Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tsnet-bridge/go.sum

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt static analysis & custom rule tests
        run: ./app/gradlew -p ./app detektAll --no-daemon

      - name: Build Android embedded tsnet binaries
        run: ./scripts/build-tsnet.sh --android

      - name: Run KMP state-machine, TLS pinning & Compose UI tests
        run: xvfb-run -a ./app/gradlew -p ./app :shared:jvmTest :desktopApp:compileKotlinJvm --no-daemon

      - name: Run Android unit tests and assemble Debug APK
        run: ./app/gradlew -p ./app :shared:testDebugUnitTest :androidApp:assembleDebug --no-daemon

  ios-compile:
    name: iOS KMP Framework & Native Bridge Link (macOS)
    if: github.event_name != 'workflow_dispatch' || inputs.run_macos != false
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tsnet-bridge/go.sum

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Build Go tsnet iOS C-archives
        run: ./scripts/build-tsnet.sh --ios

      - name: Compile & link iOS arm64 app bundle (unsigned)
        run: ./scripts/ios-install.sh --device-compile

      - name: Package macOS Desktop distributable app check
        run: ./app/gradlew -p ./app :desktopApp:createDistributable --no-daemon
