name: iosApp
options:
  bundleIdPrefix: dev.lework
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lework.app
        INFOPLIST_FILE: iosApp/Info.plist
        LEWORK_BOOTSTRAP_RELAY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: iosApp/iosApp-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../tsnet-bridge/build/ios-device $(SRCROOT)/../../tsnet-bridge/build/ios-sim"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/../../tsnet-bridge/build/ios-device"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/../../tsnet-bridge/build/ios-sim"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3 -lresolv -ltsnetbridge"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Embedded Tsnet & Kotlin Shared Framework
        script: |
          set -eu
          export JAVA_HOME="${JAVA_HOME:-/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home}"
          export PATH="$JAVA_HOME/bin:/usr/local/go/bin:/opt/homebrew/bin:$PATH"
          if [ ! -f "$SRCROOT/../../tsnet-bridge/build/ios-device/libtsnetbridge.a" ] || [ ! -f "$SRCROOT/../../tsnet-bridge/build/ios-sim/libtsnetbridge.a" ]; then
            "$SRCROOT/../../scripts/build-tsnet.sh" --ios
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
