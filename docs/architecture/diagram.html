<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lework Architecture Diagram</title>
<style>
  :root {
    --bg-0: #151b1f;
    --bg-1: #1c2429;
    --bg-2: #232d33;
    --bg-3: #2a363d;
    --border: rgba(211, 198, 170, 0.14);
    --border-strong: rgba(211, 198, 170, 0.25);
    --text-main: #e6dec8;
    --text-sub: #aeb8ad;
    --text-muted: #84928a;
    --gold: #e6c384;
    --gold-bd: rgba(230, 195, 132, 0.38);
    --green: #83c995;
    --green-bd: rgba(131, 201, 149, 0.35);
    --teal: #7fbbb3;
    --teal-bd: rgba(127, 187, 179, 0.35);
    --orange: #e69875;
    --orange-bd: rgba(230, 152, 117, 0.35);
    --plum: #d699b6;
    --plum-bd: rgba(214, 153, 182, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    min-height: 100%;
    background-color: var(--bg-0);
  }

  body {
    width: 1920px;
    background-color: var(--bg-0);
    background-image:
      radial-gradient(ellipse 920px 440px at 20% 0%, rgba(131, 201, 149, 0.095), transparent 70%),
      radial-gradient(ellipse 780px 380px at 84% 5%, rgba(230, 195, 132, 0.095), transparent 70%),
      radial-gradient(circle, rgba(211, 198, 170, 0.055) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 24px 24px;
    color: var(--text-main);
    font-family: "PingFang SC", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 26px 34px 24px;
    position: relative;
  }

  .mono {
    font-family: "JetBrainsMono Nerd Font", "SF Mono", Menlo, Consolas, monospace;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-logo {
    width: 54px;
    height: 54px;
    border-radius: 13px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.48);
    flex-shrink: 0;
  }

  .brand-title {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 0.25px;
    color: var(--text-main);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .brand-title .accent {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 0.35px;
  }

  .brand-sub {
    margin-top: 4px;
    font-size: 13px;
    color: var(--text-sub);
  }

  .metrics {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .metric-pill {
    background: var(--bg-2);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 7px 13px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 112px;
  }

  .metric-pill .val {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1.15;
  }

  .metric-pill .lbl {
    font-size: 11px;
    color: var(--text-sub);
    margin-top: 2px;
    white-space: nowrap;
  }

  /* Main layout */
  .canvas {
    display: grid;
    grid-template-columns: 1336px 464px;
    gap: 52px;
    position: relative;
    z-index: 2;
  }

  .left-stack {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .right-stack {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
  }

  /* Layer container */
  .layer {
    border-radius: 14px;
    padding: 13px 15px 14px;
    position: relative;
    background: linear-gradient(180deg, rgba(35, 45, 51, 0.93), rgba(26, 34, 39, 0.96));
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
  }

  .layer.green { border: 1px solid var(--green-bd); }
  .layer.teal { border: 1px solid var(--teal-bd); }
  .layer.orange { border: 1px solid var(--orange-bd); }
  .layer.plum { border: 1px solid var(--plum-bd); }
  .layer.gold { border: 1px solid var(--gold-bd); }

  .layer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .layer-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .layer.green .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .layer.teal .dot { background: var(--teal); box-shadow: 0 0 10px var(--teal); }
  .layer.orange .dot { background: var(--orange); box-shadow: 0 0 10px var(--orange); }
  .layer.plum .dot { background: var(--plum); box-shadow: 0 0 10px var(--plum); }
  .layer.gold .dot { background: var(--gold); box-shadow: 0 0 10px var(--gold); }

  .layer.green .layer-title { color: var(--green); }
  .layer.teal .layer-title { color: var(--teal); }
  .layer.orange .layer-title { color: var(--orange); }
  .layer.plum .layer-title { color: var(--plum); }
  .layer.gold .layer-title { color: var(--gold); }

  .layer-badge {
    font-size: 10.5px;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    color: var(--text-sub);
    background: rgba(21, 27, 31, 0.78);
    white-space: nowrap;
  }

  /* Grids & Cards */
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }

  .card {
    background: rgba(22, 29, 33, 0.88);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
  }

  .card.highlight-green { border-color: rgba(131, 201, 149, 0.28); background: rgba(131, 201, 149, 0.05); }
  .card.highlight-teal { border-color: rgba(127, 187, 179, 0.28); background: rgba(127, 187, 179, 0.05); }
  .card.highlight-orange { border-color: rgba(230, 152, 117, 0.28); background: rgba(230, 152, 117, 0.05); }
  .card.highlight-plum { border-color: rgba(214, 153, 182, 0.30); background: rgba(214, 153, 182, 0.055); }
  .card.muted { border-style: dashed; border-color: rgba(211, 198, 170, 0.20); background: rgba(22, 29, 33, 0.58); }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 5px;
  }

  .card-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-main);
  }

  .card-path {
    font-size: 10px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .card-body {
    font-size: 11.2px;
    line-height: 1.48;
    color: var(--text-sub);
  }

  .engine-tag {
    font-size: 9.5px;
    padding: 1.5px 6px;
    border-radius: 5px;
    font-weight: 600;
    white-space: nowrap;
  }

  .engine-tag.prod {
    color: var(--plum);
    background: rgba(214, 153, 182, 0.14);
    border: 1px solid rgba(214, 153, 182, 0.35);
  }

  .engine-tag.dev {
    color: var(--text-muted);
    background: rgba(132, 146, 138, 0.12);
    border: 1px solid rgba(132, 146, 138, 0.28);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .chip {
    font-size: 10.2px;
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(42, 54, 61, 0.85);
    border: 1px solid rgba(211, 198, 170, 0.14);
    color: var(--text-main);
    white-space: nowrap;
  }

  .chip.gold { color: var(--gold); border-color: rgba(230, 195, 132, 0.32); background: rgba(230, 195, 132, 0.08); }
  .chip.orange { color: var(--orange); border-color: rgba(230, 152, 117, 0.32); background: rgba(230, 152, 117, 0.08); }

  /* Shared KMP box */
  .shared-box {
    margin-top: 9px;
    border: 1px dashed rgba(131, 201, 149, 0.44);
    border-radius: 11px;
    padding: 9px 11px;
    background: rgba(19, 26, 29, 0.74);
  }

  .shared-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
  }

  .shared-label {
    font-size: 11.8px;
    font-weight: 700;
    color: var(--green);
  }

  /* Hub gateway strip */
  .gateway-strip {
    background: rgba(230, 152, 117, 0.075);
    border: 1px solid rgba(230, 152, 117, 0.34);
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 9px;
  }

  .gateway-left {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.2px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
  }

  .gateway-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: flex-end;
  }

  /* Connectors between tiers */
  .tier-connector {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .conn-pill {
    background: var(--bg-1);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 3.5px 14px;
    font-size: 10.8px;
    color: var(--text-sub);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    position: relative;
    z-index: 3;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.32);
  }

  .conn-pill strong {
    color: var(--gold);
    font-weight: 600;
  }

  .flow-dir {
    position: absolute;
    font-size: 10px;
    color: var(--text-muted);
    background: var(--bg-0);
    padding: 1px 6px;
    border-radius: 4px;
    z-index: 3;
    white-space: nowrap;
  }

  .flow-dir.left { left: 26px; }
  .flow-dir.right { right: 26px; }

  /* Host env strip */
  .host-strip {
    margin-top: 9px;
    background: rgba(20, 26, 30, 0.88);
    border: 1px solid rgba(214, 153, 182, 0.28);
    border-radius: 10px;
    padding: 7.5px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .host-strip-title {
    font-size: 11.8px;
    font-weight: 700;
    color: var(--plum);
    white-space: nowrap;
  }

  .host-strip-items {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    font-size: 11px;
  }

  .host-strip-items span {
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(42, 54, 61, 0.68);
    border: 1px solid var(--border);
    color: var(--text-main);
  }

  /* Right sidebar */
  .codegen-flow {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .codegen-box {
    background: rgba(21, 27, 31, 0.84);
    border: 1px solid rgba(230, 195, 132, 0.28);
    border-radius: 9px;
    padding: 8px 10px;
  }

  .codegen-outputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 6px;
  }

  .codegen-out {
    background: rgba(42, 54, 61, 0.72);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5.5px 8px;
  }

  .codegen-out .t { color: var(--gold); font-weight: 600; font-size: 10.8px; }
  .codegen-out .s { color: var(--text-sub); font-size: 10.2px; margin-top: 1px; }

  .rpc-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }

  .rpc-stat {
    background: rgba(230, 195, 132, 0.065);
    border: 1px solid rgba(230, 195, 132, 0.25);
    border-radius: 8px;
    padding: 6px 8px;
    text-align: center;
  }

  .rpc-stat .n { font-size: 16.5px; font-weight: 700; color: var(--gold); line-height: 1.1; }
  .rpc-stat .d { font-size: 10.2px; color: var(--text-sub); margin-top: 2px; }

  .scenario-list {
    display: flex;
    flex-direction: column;
    gap: 7.5px;
  }

  .scenario-item {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    background: rgba(21, 27, 31, 0.8);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 7.5px 10px;
  }

  .sc-num {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    background: rgba(131, 201, 149, 0.14);
    border: 1px solid rgba(131, 201, 149, 0.36);
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .sc-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.25;
  }

  .sc-desc {
    font-size: 10.8px;
    color: var(--text-sub);
    margin-top: 2px;
    line-height: 1.38;
  }

  .security-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7.5px;
  }

  .sec-item {
    background: rgba(21, 27, 31, 0.82);
    border: 1px solid rgba(127, 187, 179, 0.25);
    border-radius: 8px;
    padding: 7.5px 9.5px;
  }

  .sec-item .st {
    font-size: 11.2px;
    font-weight: 700;
    color: var(--teal);
    margin-bottom: 2px;
  }

  .sec-item .sd {
    font-size: 10.3px;
    color: var(--text-sub);
    line-height: 1.38;
  }

  /* Overlay SVG for pixel-accurate arrows & gutter pills */
  #arrow-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 4;
  }

  .footer {
    margin-top: 14px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-muted);
  }
</style>
</head>

      <section class="layer green" id="card-scenarios">
        <div class="layer-head">
          <div class="layer-title"><span class="dot"></span>${c.scTitle}</div>
          <div class="layer-badge">${c.scBadge}</div>
        </div>
        <div class="scenario-list">
          ${c.scenarios.map((s, idx) => `
            <div class="scenario-item">
              <div class="sc-num mono">${idx + 1}</div>
              <div><div class="sc-title">${s.t}</div><div class="sc-desc">${s.d}</div></div>
            </div>`).join('')}
        </div>
      </section>

      <section class="layer teal" id="card-guardrails">
        <div class="layer-head">
          <div class="layer-title"><span class="dot"></span>${c.secTitle}</div>
          <div class="layer-badge">${c.secBadge}</div>
        </div>
        <div class="security-grid">
          ${c.guardrails.map(g => `<div class="sec-item"><div class="st">${g.t}</div><div class="sd">${g.d}</div></div>`).join('')}
        </div>
      </section>
    </div>
  </div>

  <div class="footer">
    <span>${c.footerLeft}</span>
    <span class="mono">${c.footerRight}</span>
  </div>
`;

function drawArrows() {
  const svg = document.getElementById('arrow-overlay');
  const bodyRect = document.body.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${bodyRect.width} ${bodyRect.height}`);
  svg.setAttribute('width', bodyRect.width);
  svg.setAttribute('height', bodyRect.height);

  const NS = 'http://www.w3.org/2000/svg';
  const defs = document.createElementNS(NS, 'defs');

  function addMarker(id, color) {
    const m = document.createElementNS(NS, 'marker');
    m.setAttribute('id', id);
    m.setAttribute('viewBox', '0 0 10 10');
    m.setAttribute('refX', '7.5');
    m.setAttribute('refY', '5');
    m.setAttribute('markerWidth', '7');
    m.setAttribute('markerHeight', '7');
    m.setAttribute('orient', 'auto-start-reverse');
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M 1 1.5 L 8.5 5 L 1 8.5 z');
    p.setAttribute('fill', color);
    m.appendChild(p);
    defs.appendChild(m);
  }

  addMarker('arrow-teal', '#7fbbb3');
  addMarker('arrow-orange', '#e69875');
  addMarker('arrow-plum', '#d699b6');
  addMarker('arrow-gold', '#e6c384');
  svg.appendChild(defs);

  function rectOf(id) {
    const r = document.getElementById(id).getBoundingClientRect();
    return {
      left: r.left - bodyRect.left,
      right: r.right - bodyRect.left,
      top: r.top - bodyRect.top,
      bottom: r.bottom - bodyRect.top,
      cx: (r.left + r.right) / 2 - bodyRect.left,
      cy: (r.top + r.bottom) / 2 - bodyRect.top,
      w: r.width,
      h: r.height,
    };
  }

  function addPath(d, color, width, dash, markerStart, markerEnd) {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', color);
    p.setAttribute('stroke-width', width);
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-linejoin', 'round');
    if (dash) p.setAttribute('stroke-dasharray', dash);
    if (markerStart) p.setAttribute('marker-start', `url(#${markerStart})`);
    if (markerEnd) p.setAttribute('marker-end', `url(#${markerEnd})`);
    svg.appendChild(p);
  }

  function addVerticalPill(cx, cy, text) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', `translate(${cx}, ${cy}) rotate(-90)`);
    const w = Math.max(66, text.length * 9 + 16);
    const h = 18;
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', -w / 2);
    rect.setAttribute('y', -h / 2);
    rect.setAttribute('width', w);
    rect.setAttribute('height', h);
    rect.setAttribute('rx', 9);
    rect.setAttribute('fill', '#1c2429');
    rect.setAttribute('stroke', 'rgba(230, 195, 132, 0.5)');
    rect.setAttribute('stroke-width', '1');
    const txt = document.createElementNS(NS, 'text');
    txt.setAttribute('x', 0);
    txt.setAttribute('y', 3.5);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('fill', '#e6c384');
    txt.setAttribute('font-size', '10');
    txt.setAttribute('font-family', '"PingFang SC", "SF Mono", monospace');
    txt.textContent = text;
    g.appendChild(rect);
    g.appendChild(txt);
    svg.appendChild(g);
  }

  const t1 = rectOf('tier-clients');
  const t2 = rectOf('tier-transport');
  const t3 = rectOf('tier-hub');
  const t4 = rectOf('tier-engines');

  // Downward request/control flow on left, upward event stream on right
  const leftX = t1.left + 132;
  const rightX = t1.right - 132;

  addPath(`M ${leftX} ${t1.bottom + 2} L ${leftX} ${t2.top - 5}`, '#7fbbb3', 2, null, null, 'arrow-teal');
  addPath(`M ${rightX} ${t2.top - 2} L ${rightX} ${t1.bottom + 5}`, '#7fbbb3', 2, null, null, 'arrow-teal');

  addPath(`M ${leftX} ${t2.bottom + 2} L ${leftX} ${t3.top - 5}`, '#e69875', 2, null, null, 'arrow-orange');
  addPath(`M ${rightX} ${t3.top - 2} L ${rightX} ${t2.bottom + 5}`, '#e69875', 2, null, null, 'arrow-orange');

  addPath(`M ${leftX} ${t3.bottom + 2} L ${leftX} ${t4.top - 5}`, '#d699b6', 2, null, null, 'arrow-plum');
  addPath(`M ${rightX} ${t4.top - 2} L ${rightX} ${t3.bottom + 5}`, '#d699b6', 2, null, null, 'arrow-plum');

  // Dashed gold protocol contract lanes in the 52px gutter
  const proto = rectOf('card-protocol');
  const shared = rectOf('box-shared-kmp');
  const hubSrv = rectOf('box-hub-server');

  const lane1X = t1.right + 16;
  const lane2X = proto.left - 16;

  // Lane 1: protocol-schema -> app/shared (Kotlin Models)
  const pStart1Y = proto.top + proto.h * 0.28;
  const cEnd1Y = shared.cy;
  addPath(
    `M ${proto.left - 2} ${pStart1Y} L ${lane1X} ${pStart1Y} L ${lane1X} ${cEnd1Y} L ${t1.right + 5} ${cEnd1Y}`,
    '#e6c384', 1.8, '5 4', null, 'arrow-gold'
  );
  addVerticalPill(lane1X, (pStart1Y + cEnd1Y) / 2, c.gutterTop);

  // Lane 2: protocol-schema -> hub/ (Zod Runtime Guard)
  const pStart2Y = proto.top + proto.h * 0.78;
  const hEnd2Y = hubSrv.cy;
  addPath(
    `M ${proto.left - 2} ${pStart2Y} L ${lane2X} ${pStart2Y} L ${lane2X} ${hEnd2Y} L ${t3.right + 5} ${hEnd2Y}`,
    '#e6c384', 1.8, '5 4', null, 'arrow-gold'
  );
  addVerticalPill(lane2X, (t2.top + t2.bottom) / 2, c.gutterBot);
}

window.addEventListener('load', drawArrows);
</script>
</body>
</html>
